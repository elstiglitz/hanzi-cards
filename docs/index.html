<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Cards</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#bc5a49" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#4a1f1b" media="(prefers-color-scheme: dark)">
<script>
// apply the saved theme before the page paints, so dark mode does not flash white
try { var t = JSON.parse(localStorage.getItem('hanzi.v1')).settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hanzi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header id="bar">
  <button id="back" class="quiet">&lsaquo; Back</button>
  <div id="brand" class="brand"><span class="logo" lang="zh-Hans">文</span>Mandarin</div>
  <button id="menu-btn" class="quiet round" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button id="help-btn" class="quiet round" aria-label="Help" aria-haspopup="dialog" aria-expanded="false" hidden>?</button>
</header>

<div id="menu" class="help menu" role="menu" aria-label="Menu" hidden>
  <button id="go-words" role="menuitem">All words</button>
  <button id="go-add" role="menuitem">Add words <small id="sub-add"></small></button>
  <button id="go-settings" role="menuitem">Settings</button>
</div>

<div id="help" class="help" role="dialog" aria-label="Help" hidden>
</div>

<button id="update" class="update" hidden>Update available. Tap to reload.</button>

<main id="home-view" class="home">
  <div class="intro">
    <div class="eyebrow">Your daily practice</div>
    <h1>Ready to learn?</h1>
    <p>Choose how you&rsquo;d like to practice today.</p>
  </div>
  <label class="lesson-card">
    <span class="cap">Current lesson</span>
    <span id="lesson-name" class="lesson-name">All lessons</span>
    <span class="change">Change <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
    <select id="lesson" aria-label="Lesson filter"></select>
  </label>
  <div class="modes">
    <button id="go-guess" class="mode-btn guess">
      <span class="mode-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span class="mode-text"><span class="mode-title">Guess</span><span class="mode-desc">Recognize the Chinese word</span></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="go-recall" class="mode-btn recall">
      <span class="mode-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></span>
      <span class="mode-text"><span class="mode-title">Recall</span><span class="mode-desc">Remember without hints</span></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="go-listen" class="mode-btn listen">
      <span class="mode-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg></span>
      <span class="mode-text"><span class="mode-title">Listen</span><span class="mode-desc">Train your listening skills</span></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="motto"><span class="motto-zh" lang="zh-Hans">每天进步一点点</span><span class="motto-en">A little progress every day</span></div>
</main>

<main id="card-view" hidden>
  <section id="card" tabindex="0" aria-live="polite">
    <div id="listen-icon" class="listen-icon" aria-hidden="true" hidden></div>
    <div id="zh" class="zh" lang="zh-Hans"></div>
    <div id="en" class="en"></div>
    <div id="py" class="py"></div>
  </section>
  <div id="actions" class="actions">
    <button id="miss" aria-label="Missed"></button>
    <button id="speak" aria-label="Play audio"></button>
    <button id="hint" aria-label="Show pinyin"></button>
    <button id="ok" aria-label="Skip"></button>
  </div>
  <section id="done" class="done" hidden>
    <div id="done-title" class="done-title"></div>
    <div id="done-sub" class="done-sub"></div>
  </section>
</main>

<main id="settings-view" class="settings" hidden>
  <label class="set-row"><span>New words per day <small>for each mode</small></span>
    <select id="set-perday"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>50</option></select></label>
  <label class="set-row"><span>Appearance</span>
    <select id="set-theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label class="set-row"><span>Shuffle cards <small>can be switched per session in the ? menu</small></span>
    <input type="checkbox" id="set-shuffle"></label>
  <label class="set-row"><span>Play sound automatically <small>Listen mode</small></span>
    <input type="checkbox" id="set-autoplay"></label>
</main>

<main id="add-view" hidden>
  <form id="add-form" novalidate>
    <input id="f-zh" class="zh-input" lang="zh-Hans" placeholder="Chinese" autocomplete="off">
    <input id="f-py" placeholder="Pinyin (optional)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input id="f-en" placeholder="English (optional)" autocomplete="off" autocapitalize="none">
    <input id="f-lesson" list="lesson-options" placeholder="Lesson (optional)" autocomplete="off">
    <datalist id="lesson-options"></datalist>
    <div class="form-row">
      <button id="f-submit" type="submit" class="primary">Add</button>
      <button id="f-cancel" type="button" class="quiet" hidden>Cancel</button>
    </div>
    <p id="f-msg" class="msg" role="status"></p>
  </form>

  <details class="bulk">
    <summary>Bulk import</summary>
    <p class="hint">One word per line: Chinese, Pinyin, English, Lesson. Only Chinese is required. Rows without a lesson stay unassigned.</p>
    <textarea id="bulk-text" rows="6" aria-label="Words to import" spellcheck="false"></textarea>
    <div class="form-row">
      <button id="bulk-go" type="button" class="primary">Import</button>
      <label class="quiet file-btn">Choose file<input id="bulk-file" type="file" accept=".csv,.txt,text/csv,text/plain" hidden></label>
    </div>
    <p id="bulk-msg" class="msg" role="status"></p>
  </details>

  <section id="inbox" hidden>
    <h2>Waiting for the Mac <span id="inbox-count"></span></h2>
    <ul id="inbox-list"></ul>
    <div class="form-row">
      <button id="export" type="button" class="primary">Export</button>
      <button id="copy" type="button" class="quiet">Copy as text</button>
    </div>
    <div id="exported-row" class="form-row" hidden>
      <span id="exported-msg"></span>
      <button id="clear" type="button" class="quiet">Clear inbox</button>
    </div>
    <p id="inbox-msg" class="msg" role="status"></p>
  </section>
</main>

<main id="lessons-view" class="lessons" hidden></main>

<main id="list-view" hidden>
  <input id="search" type="search" placeholder="Search character, pinyin or English" autocomplete="off">
  <div class="counter"><span id="list-count"></span></div>
  <ul id="list"></ul>
</main>

<script src="app.js"></script>
</body>
</html>
